[package]
name = "cinephile-rust-api"
version = "0.1.0"
edition = "2021"
authors = ["CiNEPHiLE Team"]
description = "High-performance, secure backend API for CiNEPHiLE with Cloudflare R2 integration"

[dependencies]
# HTTP Server & Networking
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Databases & Cache
mongodb = { version = "3.2", default-features = false, features = ["tokio-runtime"] }
redis = { version = "0.28", features = ["tokio-comp"] }

# HTTP Client (for external TMDB & Cloudflare R2 REST)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Security & Cryptography
subtle = "2.6"           # Constant-time comparison for secrets and tokens
sha2 = "0.10"            # SHA-256 hashing for AWS SigV4 and session tokens
hmac = "0.12"            # HMAC-SHA256 for session authentication and SigV4
hex = "0.4"              # Hex encoding for signatures
aes-gcm = "0.10"         # Authenticated AES-GCM encryption for media assets
rand = "0.8"             # Cryptographically secure random bytes

# Utilities & Logging
dotenvy = "0.15"         # Environment variable management
tracing = "0.1"          # Structured application tracing
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
mime_guess = "2.0"       # Correct MIME type detection for R2 media/subtitles
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
