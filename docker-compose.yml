services:
  rust-api:
    build:
      context: ./backend/rust-api
      dockerfile: Dockerfile
    image: cinephile-rust-api:staging
    container_name: cinephile-rust-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - RUST_LOG=${RUST_LOG:-info,cinephile_rust_api=debug}
      # Admin Authentication
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # Authoritative Database (Staging / Atlas)
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-cinefuel}
      # Cache & Rate Limiting
      - REDIS_URL=${REDIS_URL}
      # Cloudflare R2 Object Storage
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # External Metadata
      - TMDB_API_KEY=${TMDB_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
