name: Deploy CineFuel Staging to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - cloudflare-staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-Deployment Safety Verification
        run: |
          echo "=== VERIFYING DEPLOYMENT TARGET ==="
          echo "Current Branch: $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::CRITICAL VIOLATION: Deployment from main branch is strictly forbidden in staging workflow!"
            exit 1
          fi
          
          WORKER_NAME=$(grep '^name = ' wrangler.staging.toml | head -n1 | cut -d '"' -f 2)
          echo "Target Worker Name: $WORKER_NAME"
          if [ "$WORKER_NAME" != "cinefuel-staging" ]; then
            echo "::error::CRITICAL VIOLATION: Target worker must be 'cinefuel-staging' but got '$WORKER_NAME'!"
            exit 1
          fi
          echo "Pre-deployment safety checks PASSED. Deploying ONLY to cinefuel-staging."

      - name: Build Next.js with OpenNext Cloudflare
        run: npx opennextjs-cloudflare build --config wrangler.staging.toml
        env:
          NEXT_PUBLIC_SITE_URL: "https://cinefuel-staging.sk6216071.workers.dev"
          NEXT_PUBLIC_TMDB_API_KEY: "8265bd1679663a7ea12ac168da84d2e8"
          APP_ENV: "staging"
          CINEFUEL_ENV: "staging"
          WORKER_NAME: "cinefuel-staging"

      - name: Verify Cloudflare Authentication Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is NOT SET in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions to add it."
            exit 1
          else
            echo "CLOUDFLARE_API_TOKEN is present in GitHub Secrets (length: ${#CLOUDFLARE_API_TOKEN})"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure Staging Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '46f7bef008a04d13a6bd134c3a291006'
          STAGE_MONGO: ${{ secrets.MONGODB_URI || secrets.STAGE_MONGODB_URI || secrets.STAGING_MONGODB_URI }}
          STAGE_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || secrets.STAGE_UPSTASH_REDIS_REST_URL || secrets.STAGING_REDIS_URL || secrets.KV_REST_API_URL }}
          STAGE_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.STAGE_UPSTASH_REDIS_REST_TOKEN || secrets.STAGING_REDIS_TOKEN || secrets.KV_REST_API_TOKEN }}
          STAGE_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.STAGE_TELEGRAM_BOT_TOKEN }}
          STAGE_ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_KEY || secrets.STAGE_ADMIN_SECRET_KEY || secrets.STAGING_ADMIN_KEY || secrets.ADMIN_PASSWORD }}
          STAGE_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET || secrets.STAGE_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          echo "=== AUDITING STAGING SECRETS PRESENCE ==="
          HAS_MONGO=$([ -n "$STAGE_MONGO" ] && echo 'YES' || echo 'NO')
          HAS_REDIS_URL=$([ -n "$STAGE_REDIS_URL" ] && echo 'YES' || echo 'NO')
          HAS_REDIS_TOKEN=$([ -n "$STAGE_REDIS_TOKEN" ] && echo 'YES' || echo 'NO')
          HAS_ADMIN_SECRET=$([ -n "$STAGE_ADMIN_SECRET" ] && echo 'YES' || echo 'NO')
          HAS_TG_WEBHOOK=$([ -n "$STAGE_TELEGRAM_WEBHOOK_SECRET" ] && echo 'YES' || echo 'NO')
          HAS_TG_TOKEN=$([ -n "$STAGE_TELEGRAM_TOKEN" ] && echo 'YES' || echo 'NO')

          echo "MONGODB_URI present: $HAS_MONGO"
          echo "UPSTASH_REDIS_REST_URL present: $HAS_REDIS_URL"
          echo "UPSTASH_REDIS_REST_TOKEN present: $HAS_REDIS_TOKEN"
          echo "ADMIN_SECRET_KEY present: $HAS_ADMIN_SECRET"
          echo "TELEGRAM_WEBHOOK_SECRET present: $HAS_TG_WEBHOOK"
          echo "TELEGRAM_BOT_TOKEN present: $HAS_TG_TOKEN"
          echo "==========================================="

          echo "### Staging Secrets Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| MONGODB_URI | $HAS_MONGO |" >> $GITHUB_STEP_SUMMARY
          echo "| UPSTASH_REDIS_REST_URL | $HAS_REDIS_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| UPSTASH_REDIS_REST_TOKEN | $HAS_REDIS_TOKEN |" >> $GITHUB_STEP_SUMMARY
          echo "| ADMIN_SECRET_KEY | $HAS_ADMIN_SECRET |" >> $GITHUB_STEP_SUMMARY
          echo "| TELEGRAM_WEBHOOK_SECRET | $HAS_TG_WEBHOOK |" >> $GITHUB_STEP_SUMMARY
          echo "| TELEGRAM_BOT_TOKEN | $HAS_TG_TOKEN |" >> $GITHUB_STEP_SUMMARY

          if [ -n "$STAGE_MONGO" ]; then
            printf '%s' "$STAGE_MONGO" | npx wrangler secret put MONGODB_URI --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_URL" ]; then
            printf '%s' "$STAGE_REDIS_URL" | npx wrangler secret put UPSTASH_REDIS_REST_URL --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_TOKEN" ]; then
            printf '%s' "$STAGE_REDIS_TOKEN" | npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_TELEGRAM_TOKEN" ]; then
            printf '%s' "$STAGE_TELEGRAM_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_ADMIN_SECRET" ]; then
            printf '%s' "$STAGE_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET_KEY --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$STAGE_TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --name cinefuel-staging --config wrangler.staging.toml
          fi

      - name: Deploy to Cloudflare Workers Staging
        run: npx opennextjs-cloudflare deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '46f7bef008a04d13a6bd134c3a291006'
          OPEN_NEXT_DEPLOY: 'true'

      - name: Ensure Staging Secrets Bound Post-Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '46f7bef008a04d13a6bd134c3a291006'
          STAGE_MONGO: ${{ secrets.MONGODB_URI || secrets.STAGE_MONGODB_URI || secrets.STAGING_MONGODB_URI }}
          STAGE_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || secrets.STAGE_UPSTASH_REDIS_REST_URL || secrets.STAGING_REDIS_URL || secrets.KV_REST_API_URL }}
          STAGE_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.STAGE_UPSTASH_REDIS_REST_TOKEN || secrets.STAGING_REDIS_TOKEN || secrets.KV_REST_API_TOKEN }}
          STAGE_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.STAGE_TELEGRAM_BOT_TOKEN }}
          STAGE_ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_KEY || secrets.STAGE_ADMIN_SECRET_KEY || secrets.STAGING_ADMIN_KEY || secrets.ADMIN_PASSWORD }}
          STAGE_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET || secrets.STAGE_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STAGE_MONGO" ]; then
            printf '%s' "$STAGE_MONGO" | npx wrangler secret put MONGODB_URI --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_URL" ]; then
            printf '%s' "$STAGE_REDIS_URL" | npx wrangler secret put UPSTASH_REDIS_REST_URL --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_TOKEN" ]; then
            printf '%s' "$STAGE_REDIS_TOKEN" | npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_TELEGRAM_TOKEN" ]; then
            printf '%s' "$STAGE_TELEGRAM_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_ADMIN_SECRET" ]; then
            printf '%s' "$STAGE_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET_KEY --name cinefuel-staging --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$STAGE_TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --name cinefuel-staging --config wrangler.staging.toml
          fi
