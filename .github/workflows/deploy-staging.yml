name: Deploy CineFuel Staging to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - cloudflare-staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js with OpenNext Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: "https://cinefuel-staging.sk6216071.workers.dev"
          NEXT_PUBLIC_TMDB_API_KEY: "8265bd1679663a7ea12ac168da84d2e8"

      - name: Deploy to Cloudflare Workers Staging
        run: npx wrangler deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '46f7bef008a04d13a6bd134c3a291006'

      - name: Configure Staging Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '46f7bef008a04d13a6bd134c3a291006'
          STAGE_MONGO: ${{ secrets.MONGODB_URI }}
          STAGE_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          STAGE_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          STAGE_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$STAGE_MONGO" ]; then
            echo "$STAGE_MONGO" | npx wrangler secret put MONGODB_URI --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_URL" ]; then
            echo "$STAGE_REDIS_URL" | npx wrangler secret put UPSTASH_REDIS_REST_URL --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_REDIS_TOKEN" ]; then
            echo "$STAGE_REDIS_TOKEN" | npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --config wrangler.staging.toml
          fi
          if [ -n "$STAGE_TELEGRAM_TOKEN" ]; then
            echo "$STAGE_TELEGRAM_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.staging.toml
          fi
